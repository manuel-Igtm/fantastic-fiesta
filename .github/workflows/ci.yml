name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t save-sabi-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t save-sabi-web:ci .

      - name: Build AI image
        run: docker build -f services/ai-orchestrator/Dockerfile -t save-sabi-ai:ci .

  ai-service-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-orchestrator/requirements.txt

      - name: Syntax check
        run: python -m compileall services/ai-orchestrator/app
