apiVersion: apps/v1
kind: Deployment
metadata:
  name: save-sabi-ai
  labels:
    app.kubernetes.io/name: save-sabi-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: save-sabi-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: save-sabi-ai
    spec:
      containers:
        - name: ai
          image: ghcr.io/your-org/save-sabi-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: save-sabi-ai
  labels:
    app.kubernetes.io/name: save-sabi-ai
spec:
  selector:
    app.kubernetes.io/name: save-sabi-ai
  ports:
    - name: http
      port: 8001
      targetPort: http
  type: ClusterIP
