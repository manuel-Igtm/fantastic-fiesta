apiVersion: apps/v1
kind: Deployment
metadata:
  name: save-sabi-api
  labels:
    app: save-sabi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: save-sabi-api
  template:
    metadata:
      labels:
        app: save-sabi-api
    spec:
      containers:
        - name: api
          image: ghcr.io/save-sabi/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: REDIS_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_TTL
              valueFrom:
                configMapKeyRef:
                  name: save-sabi-config
                  key: JWT_ACCESS_TTL
            - name: JWT_REFRESH_TTL
              valueFrom:
                configMapKeyRef:
                  name: save-sabi-config
                  key: JWT_REFRESH_TTL
            - name: TOKENIZATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: TOKENIZATION_SECRET
            - name: CALLBACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: CALLBACK_SIGNING_SECRET
            - name: PARTNER_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: save-sabi-secrets
                  key: PARTNER_CALLBACK_SECRET
            - name: IDEMPOTENCY_KEY_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: save-sabi-config
                  key: IDEMPOTENCY_KEY_TTL_SECONDS
            - name: AI_ORCHESTRATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: save-sabi-config
                  key: AI_ORCHESTRATOR_URL
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
